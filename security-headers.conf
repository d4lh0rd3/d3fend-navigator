# En-têtes de sécurité. À inclure dans chaque bloc location qui définit ses propres
# add_header : nginx n'hérite alors plus ceux du niveau parent.
#
# CSP ($csp_policy, défini dans nginx.conf) :
# - aucun 'unsafe-inline' : les <style> injectés par Angular portent le nonce de la requête ;
# - Trusted Types imposés (politiques "angular" et "angular#bundler" fournies par Angular).
add_header Content-Security-Policy $csp_policy always;

# HSTS : ignoré par les navigateurs en HTTP, effectif dès que l'application est servie en HTTPS.
add_header Strict-Transport-Security "max-age=63072000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Origin-Agent-Cluster "?1" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
