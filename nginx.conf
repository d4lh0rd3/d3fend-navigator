# Configuration nginx complète (remplace /etc/nginx/nginx.conf de l'image de base).
# Conçue pour tourner en non-root (uid 101), avec un système de fichiers en lecture
# seule : seul /tmp doit être inscriptible (tmpfs).

# Valeur fixe plutôt que "auto" : "auto" compte les CPU de l'hôte, pas ceux du conteneur.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    # Ne pas divulguer la version d'nginx (en-tête Server, pages d'erreur).
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rid=$request_id';
    access_log /dev/stdout main;

    sendfile   on;
    tcp_nopush on;

    # Site statique en lecture seule : requêtes petites, délais courts (atténue slowloris).
    client_max_body_size        1k;
    client_body_buffer_size     1k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                10s;
    keepalive_timeout           15s;
    reset_timedout_connection   on;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Nonce CSP par requête : $request_id = 128 bits aléatoires (hex).
    # Injecté dans index.html (attribut ngCspNonce lu par Angular pour ses <style>).
    map $request_id $csp_policy {
        default "default-src 'none'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler; upgrade-insecure-requests";
    }

    server {
        listen 8080;
        server_name _;
        root  /usr/share/nginx/html;
        index index.html;

        # Redirections relatives : ne pas exposer le port interne 8080 derrière un proxy.
        absolute_redirect off;
        autoindex off;

        # Seules les méthodes de lecture sont utiles à une SPA statique.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        include /etc/nginx/security-headers.conf;

        # Fichiers cachés (.git, .env, …) : jamais servis.
        location ~ /\. {
            return 404;
        }

        # Fichiers hachés par le build : cache long.
        location ~* \.(?:js|css)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # index.html porte un nonce propre à chaque réponse : ne jamais le stocker.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            sub_filter_once off;
            sub_filter 'CSP_NONCE_PLACEHOLDER' '$request_id';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
