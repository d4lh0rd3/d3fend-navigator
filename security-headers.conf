# En-têtes de sécurité. À inclure dans chaque bloc location qui définit ses propres
# add_header : nginx n'hérite alors plus ceux du niveau parent.
#
# style-src autorise 'unsafe-inline' pour les bindings de style Angular ([style.*]) ;
# script-src reste strict (inlineCritical est désactivé dans angular.json pour cette raison).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
